name: Deploy to GitHub Pages

# Trigger the workflow on push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          cd tool/sdr-simulator
          npm install

      # Step 4: Build the project
      - name: Build project
        run: |
          cd tool/sdr-simulator
          npm run build

      # Step 5: Set up Git configuration for gh-pages deployment
      - name: Set up Git user
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # Step 6: Configure GitHub token for authentication
      - name: Configure Git for GitHub Pages
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kavicastelo/silent-delivery-receipts.git

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: |
          cd tool/sdr-simulator
          npm install --save-dev gh-pages
          npx gh-pages -d dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
